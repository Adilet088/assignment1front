<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - CS2 Esports</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="header-content">
            <div>CS2 ESPORTS</div>

            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>
        </div>
    </header>


    <main>

        <section>

            <h1>Contact</h1>

            <p>
                Use the form below to share your opinion about CS2 esports.
            </p>


            <form>

                <fieldset>

                    <legend>Contact Form</legend>


                    <label for="name">Name:</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        minlength="2">


                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required>


                    <label for="team">Favorite CS2 Team:</label>
                    <input
                        type="text"
                        id="team"
                        name="team"
                        placeholder="For example: Team Spirit">


                    <label for="tournament">Favorite Tournament:</label>
                    <select id="tournament" name="tournament">

                        <option value="">Choose a tournament</option>
                        <option value="pgl-astana">PGL Astana</option>
                        <option value="iem">IEM</option>
                        <option value="blast">BLAST Premier</option>
                        <option value="esl">ESL Pro League</option>

                    </select>


                    <p>How often do you watch CS2 esports?</p>

                    <input
                        type="radio"
                        id="often"
                        name="watching"
                        value="often">

                    <label for="often">Often</label>


                    <input
                        type="radio"
                        id="sometimes"
                        name="watching"
                        value="sometimes">

                    <label for="sometimes">Sometimes</label>


                    <input
                        type="radio"
                        id="rarely"
                        name="watching"
                        value="rarely">

                    <label for="rarely">Rarely</label>


                    <label for="message">Message:</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Write your message here"></textarea>


                    <label for="age">Your age:</label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        min="13"
                        max="100">
                        <label>
    <input
        type="checkbox"
        name="newsletter"
        value="yes">
    I want to receive CS2 news
</label>


                    <button type="submit">Submit</button>

                </fieldset>

            </form>

        </section>

    </main>


    <footer>
        <p>CS2 Esports 2026</p>
    </footer>

</body>
</html>
